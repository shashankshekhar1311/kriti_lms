name: Test compute orchestrator

on:
  pull_request:
    paths:
      - "compute/orchestrator.py"
      - "compute/cli.py"
      - "config/compute.py"
      - "config/env.py"
      - "scripts/runpod_startup.sh"
      - "test_compute_orchestrator.py"
      - ".github/workflows/test-compute-orchestrator.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check startup shell syntax
        run: bash -n scripts/runpod_startup.sh

      - name: Run orchestrator tests
        run: python test_compute_orchestrator.py

      - name: Check CLI help
        run: python -m compute.cli --help
