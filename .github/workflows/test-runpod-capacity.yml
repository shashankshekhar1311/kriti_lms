name: Test RunPod capacity retry

on:
  pull_request:
    paths:
      - "compute/providers/runpod.py"
      - "compute/exceptions.py"
      - "config/compute.py"
      - "compute/cli.py"
      - "test_runpod_provider.py"
      - ".github/workflows/test-runpod-capacity.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run RunPod provider tests
        run: python test_runpod_provider.py

      - name: Check compute CLI help
        run: python -m compute.cli --help
