<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="voltFur" cx="45%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E8964A"/>
      <stop offset="60%" stop-color="#C2661A"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </radialGradient>
    <radialGradient id="voltBelly" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="100%" stop-color="#F0DFC0"/>
    </radialGradient>
    <linearGradient id="voltLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF0FA"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="voltTail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="55%" stop-color="#C2661A"/>
      <stop offset="100%" stop-color="#E8964A"/>
    </linearGradient>
  </defs>

  <!-- feet -->
  <ellipse cx="168" cy="452" rx="24" ry="11" fill="#8B4513"/>
  <ellipse cx="232" cy="452" rx="24" ry="11" fill="#8B4513"/>

  <!-- bushy tail, arcing up behind the body -->
  <path d="M296 316 C352 300 372 224 344 158 C332 132 306 118 288 128
           C312 150 320 196 300 232 C286 258 262 274 250 296
           C238 316 254 338 278 336 C284 336 290 328 296 316 Z"
        fill="url(#voltTail)" stroke="#6B3410" stroke-width="4"/>
  <path d="M296 200 C310 176 314 150 306 132" fill="none"
        stroke="#06B6D4" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- body -->
  <ellipse cx="200" cy="336" rx="100" ry="108" fill="url(#voltFur)" stroke="#6B3410" stroke-width="4"/>
  <ellipse cx="200" cy="352" rx="62" ry="70" fill="url(#voltBelly)"/>

  <!-- chest power-core -->
  <polygon points="200,282 219,294 219,318 200,330 181,318 181,294"
           fill="#06B6D4" stroke="#F59E0B" stroke-width="4"/>
  <circle cx="200" cy="306" r="7" fill="#FDF6E3" opacity="0.85"/>

  <!-- arms at sides -->
  <path d="M108 320 C92 344 90 372 100 392 C106 404 122 402 126 388
           C118 368 120 344 130 326 Z" fill="url(#voltFur)" stroke="#6B3410" stroke-width="3"/>
  <path d="M292 320 C308 344 310 372 300 392 C294 404 278 402 274 388
           C282 368 280 344 270 326 Z" fill="url(#voltFur)" stroke="#6B3410" stroke-width="3"/>

  <!-- wrist gauntlet -->
  <rect x="90" y="384" width="34" height="22" rx="6" fill="#4B5563" stroke="#374151" stroke-width="2"/>
  <circle cx="107" cy="395" r="4" fill="#FDE047"/>

  <!-- head -->
  <circle cx="200" cy="178" r="92" fill="url(#voltFur)" stroke="#6B3410" stroke-width="4"/>
  <ellipse cx="200" cy="214" rx="46" ry="34" fill="url(#voltBelly)"/>

  <!-- ears -->
  <path d="M146 108 C132 84 140 60 160 56 C176 54 186 70 182 90
           C176 100 158 106 146 108 Z" fill="url(#voltFur)" stroke="#6B3410" stroke-width="3"/>
  <path d="M156 92 C150 78 154 66 164 64 C172 64 176 74 172 84 Z" fill="#F0DFC0"/>
  <path d="M254 108 C268 84 260 60 240 56 C224 54 214 70 218 90
           C224 100 242 106 254 108 Z" fill="url(#voltFur)" stroke="#6B3410" stroke-width="3"/>
  <path d="M244 92 C250 78 246 66 236 64 C228 64 224 74 228 84 Z" fill="#F0DFC0"/>

  <!-- goggle strap -->
  <rect x="118" y="156" width="164" height="16" rx="8" fill="#374151"/>
  <!-- goggles -->
  <circle cx="160" cy="168" r="38" fill="#4B5563"/>
  <circle cx="160" cy="168" r="30" fill="url(#voltLens)"/>
  <circle cx="240" cy="168" r="38" fill="#4B5563"/>
  <circle cx="240" cy="168" r="30" fill="url(#voltLens)"/>
  <circle cx="150" cy="158" r="7" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="230" cy="158" r="7" fill="#FFFFFF" opacity="0.7"/>

  <!-- muzzle + nose + mouth (closed, calm) -->
  <ellipse cx="200" cy="216" rx="26" ry="18" fill="#F0DFC0"/>
  <ellipse cx="200" cy="204" rx="8" ry="6" fill="#3F2A16"/>
  <path d="M186 222 Q200 230 214 222" stroke="#6B3410" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M150 214 Q124 210 106 216" stroke="#6B3410" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M150 224 Q124 226 108 234" stroke="#6B3410" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M250 214 Q276 210 294 216" stroke="#6B3410" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M250 224 Q276 226 292 234" stroke="#6B3410" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
