<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F3B655"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFCF2"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2670A"/>
      <stop offset="100%" stop-color="#B45F09"/>
    </linearGradient>
  </defs>

  <!-- ===== Sparkles / stars around head ===== -->
  <g fill="#06B6D4">
    <path d="M60 90 L66 104 L80 110 L66 116 L60 130 L54 116 L40 110 L54 104 Z"/>
    <path d="M340 70 L344 80 L354 84 L344 88 L340 98 L336 88 L326 84 L336 80 Z"/>
    <path d="M330 160 L333 168 L341 171 L333 174 L330 182 L327 174 L319 171 L327 168 Z"/>
  </g>
  <g fill="#F59E0B">
    <path d="M90 50 L93 58 L101 61 L93 64 L90 72 L87 64 L79 61 L87 58 Z"/>
    <path d="M300 110 L304 120 L314 124 L304 128 L300 138 L296 128 L286 124 L296 120 Z"/>
  </g>
  <circle cx="110" cy="130" r="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="316" cy="60" r="3.5" fill="#FEF3C7" stroke="#06B6D4" stroke-width="1.5"/>

  <!-- ===== Feet ===== -->
  <g>
    <ellipse cx="163" cy="440" rx="22" ry="10" fill="#F59E0B"/>
    <ellipse cx="237" cy="440" rx="22" ry="10" fill="#F59E0B"/>
    <path d="M148 440 q-6 8 -12 6 M163 442 q0 9 -1 9 M178 440 q6 8 12 6" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M222 440 q-6 8 -12 6 M237 442 q0 9 -1 9 M252 440 q6 8 12 6" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== Body ===== -->
  <ellipse cx="200" cy="330" rx="118" ry="112" fill="url(#bodyGrad)" stroke="#B45309" stroke-width="4"/>

  <!-- Belly patch -->
  <ellipse cx="200" cy="352" rx="72" ry="80" fill="#FEF3C7"/>
  <path d="M170 300 q30 14 60 0" stroke="#FDE9A8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M165 330 q35 16 70 0" stroke="#FDE9A8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M165 362 q35 16 70 0" stroke="#FDE9A8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M172 392 q28 13 56 0" stroke="#FDE9A8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- ===== Scholar collar ===== -->
  <path d="M138 258 Q200 300 262 258 L262 278 Q200 322 138 278 Z" fill="#06B6D4" stroke="#0891B2" stroke-width="3"/>
  <circle cx="200" cy="295" r="7" fill="#FEF3C7" stroke="#0891B2" stroke-width="2"/>

  <!-- ===== Head / Heart-shaped face disc ===== -->
  <g>
    <path d="M200 88
             C 130 88 92 150 100 210
             C 106 252 130 268 150 276
             C 168 282 186 250 200 250
             C 214 250 232 282 250 276
             C 270 268 294 252 300 210
             C 308 150 270 88 200 88 Z"
          fill="url(#bodyGrad)" stroke="#B45309" stroke-width="4"/>

    <path d="M200 108
             C 148 108 118 156 124 202
             C 128 236 148 248 163 253
             C 178 258 190 232 200 232
             C 210 232 222 258 237 253
             C 252 248 272 236 276 202
             C 282 156 252 108 200 108 Z"
          fill="url(#faceGrad)"/>
  </g>

  <!-- ===== Happy crescent-curved eyes (^^) ===== -->
  <path d="M132 192 Q164 160 196 192" stroke="#2B1808" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M204 192 Q236 160 268 192" stroke="#2B1808" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- ===== Round golden spectacles ===== -->
  <g fill="none" stroke="#F59E0B" stroke-width="6">
    <circle cx="164" cy="188" r="46"/>
    <circle cx="236" cy="188" r="46"/>
  </g>
  <path d="M210 186 Q200 178 190 186" stroke="#F59E0B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M118 186 Q104 182 96 190" stroke="#F59E0B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M282 186 Q296 182 304 190" stroke="#F59E0B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="164" cy="188" r="46" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="236" cy="188" r="46" fill="#FFFFFF" opacity="0.04"/>

  <!-- ===== Raised joyful eyebrows ===== -->
  <path d="M128 140 Q150 122 180 136" stroke="#B45309" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M272 140 Q250 122 220 136" stroke="#B45309" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== Cheerful wide open beak smile ===== -->
  <path d="M178 216 Q200 210 222 216 Q220 250 200 260 Q180 250 178 216 Z" fill="#B45309"/>
  <path d="M182 219 Q200 214 218 219 Q216 244 200 252 Q184 244 182 219 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <!-- little tongue-like highlight for cheer -->
  <ellipse cx="200" cy="240" rx="9" ry="6" fill="#EA9A2E" opacity="0.6"/>

  <!-- ===== Cheek blush (bigger for happy) ===== -->
  <ellipse cx="136" cy="216" rx="15" ry="10" fill="#FDBA74" opacity="0.6"/>
  <ellipse cx="264" cy="216" rx="15" ry="10" fill="#FDBA74" opacity="0.6"/>

  <!-- ===== Both wings raised high in celebration ===== -->
  <path d="M108 262
           C 66 240 34 190 28 140
           C 26 122 40 116 50 128
           C 78 162 100 202 128 232
           C 140 246 138 264 122 270
           C 116 272 112 268 108 262 Z"
        fill="url(#wingGrad)" stroke="#8A4708" stroke-width="3"/>
  <path d="M292 262
           C 334 240 366 190 372 140
           C 374 122 360 116 350 128
           C 322 162 300 202 272 232
           C 260 246 262 264 278 270
           C 284 272 288 268 292 262 Z"
        fill="url(#wingGrad)" stroke="#8A4708" stroke-width="3"/>
  <!-- feather detail on raised wings -->
  <path d="M60 170 Q80 190 96 216 M44 150 Q66 176 84 204" stroke="#8A4708" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M340 170 Q320 190 304 216 M356 150 Q334 176 316 204" stroke="#8A4708" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
